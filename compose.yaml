services:
  postgis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgis-llm-eval-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgis_data:
